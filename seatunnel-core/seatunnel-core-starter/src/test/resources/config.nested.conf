env {
  parallelism = 1
}

source {
  MySQL {
    # Top-level sensitive fields (exact match from sensitive-fields.conf)
    username = "root"
    password = "my_password"

    # Nested configuration with sensitive fields
    connection_config {
      host = "localhost"
      port = 3306
      # These should be encrypted with exact matching (must be in sensitive-fields.conf)
      db_password = "nested_password"
      api_token = "my_api_token"
      user_credential = "my_credential"
      # Non-sensitive field
      timeout = 30
    }

    # Another nested level
    advanced_settings {
      ssl_config {
        # Should be encrypted (exact match: must be in sensitive-fields.conf)
        ssl_password = "ssl_secret"
        # Should be encrypted (exact match: must be in sensitive-fields.conf)
        secret_key = "my_secret_key"
      }
    }

    result_table_name = "test_table"
  }
}

sink {
  Console {
    # Sink with nested auth config
    auth_config {
      # Should be encrypted with exact matching (must be in sensitive-fields.conf)
      access_token = "sink_access_token"
      api_secret = "sink_api_secret"
    }
  }
}

