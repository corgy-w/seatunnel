env {
"job.name"="v26_write_batch_mysql_to_s3"
"job.mode"=BATCH
}
source {
Jdbc {
    "split.size"=8096
    parallelism=1
    "result_table_name"=Table12229431742624
    "table_path"="test.test.example_table_1"
    password="Whal1234"
    driver="com.huawei.gauss200.jdbc.Driver"
    url="jdbc:gaussdb://localhost:8000/test"
    user="dwsadmin"
}
}
transform {
}
sink {
Jdbc {
    "schema_save_mode"="RECREATE_SCHEMA"
    "data_save_mode"="APPEND_DATA"
    "max_retries"="1"
    "field_ide"=ORIGINAL
    "source_table_name"=Table12680307042080
    database=test
    table="${schema_name}.${table_name}"
    user="postgres"
    driver="org.postgresql.Driver"
    password="postgres"
    generate_sink_sql=true
    url="jdbc:postgresql://host.docker.internal:5432/test"
}
}